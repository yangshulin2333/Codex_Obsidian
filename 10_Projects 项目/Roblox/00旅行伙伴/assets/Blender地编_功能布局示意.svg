      .label { font-size: 20px; font-weight: 700; }
      .small { font-size: 16px; }
      .tiny { font-size: 14px; }
      .plot { fill: #eef1d9; stroke: #6f9676; stroke-width: 2; }
      .anchor { fill: #d18a4c; }
